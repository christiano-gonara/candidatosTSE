<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos TSE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topo">
    <div>
        <p class="eyebrow">Dados eleitorais de Minas Gerais</p>
        <h1>Sistema de Consulta de Candidatos TSE</h1>
        <p class="subtitulo">Pesquise por nome, número, cargo ou partido.</p>
    </div>
</header>

<main class="container">
    <form method="get" th:action="@{/}" class="filtros">
        <div class="campo campo-texto">
            <label for="texto">Busca</label>
            <input id="texto" type="text" name="texto" th:value="${textoSelecionado}"
                placeholder="Nome, nome de urna ou número">
        </div>

        <div class="campo">
            <label for="cargo">Cargo</label>
            <select id="cargo" name="cargo">
                <option value="" th:selected="${cargoSelecionado == ''}">Todos</option>
                <option th:each="c : ${cargos}" th:value="${c}" th:text="${c}"
                        th:selected="${c == cargoSelecionado}"></option>
            </select>
        </div>

        <div class="campo">
            <label for="partido">Partido</label>
            <select id="partido" name="partido">
                <option value="" th:selected="${partidoSelecionado == ''}">Todos</option>
                <option th:each="p : ${partidos}" th:value="${p}" th:text="${p}"
                        th:selected="${p == partidoSelecionado}"></option>
            </select>
        </div>

        <div class="acoes">
            <button type="submit">Filtrar</button>
            <a th:href="@{/}" class="limpar">Limpar</a>
        </div>
    </form>

    <p class="resultado-info">
        <strong th:text="${totalEncontrado}">0</strong> candidato(s) encontrado(s).
    </p>

    <p th:if="${totalEncontrado == 0}" class="sem-resultado">
        Nenhum candidato encontrado com esses filtros.
    </p>

    <section class="grade-candidatos" th:if="${totalEncontrado > 0}">
        <article class="card" th:each="cand : ${candidatos}">
            <img th:src="@{/images/candidatos/{arquivo}(arquivo=${cand.nomeArquivoFoto})}"
                th:alt="${cand.nomeUrna}" class="foto-candidato">
            <div class="card-conteudo">
                <h2 th:text="${cand.nomeUrna}">Nome de urna</h2>
                <p class="numero" th:text="${'Número ' + cand.nrCandidato}">Número</p>
                <p class="cargo-partido">
                    <span th:text="${cand.cargo}">Cargo</span>
                    <span th:text="${cand.siglaPartido}">Partido</span>
                </p>
                <p class="extra" th:if="${cand.situacaoCandidatura != null and !cand.situacaoCandidatura.isBlank()}"
                th:text="${cand.situacaoCandidatura}">Situação</p>
                <p class="extra" th:if="${cand.idade > 0}" th:text="${cand.idade + ' anos'}">Idade</p>
                <p class="extra" th:if="${cand.ocupacao != null and !cand.ocupacao.isBlank()}"
                th:text="${cand.ocupacao}">Ocupação</p>
                <p class="extra" th:if="${cand.grauInstrucao != null and !cand.grauInstrucao.isBlank()}"
                th:text="${cand.grauInstrucao}">Escolaridade</p>
            </div>
        </article>
    </section>
</main>
</body>
</html>
